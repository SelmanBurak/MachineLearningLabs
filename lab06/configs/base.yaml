experiment_name: "Lab06_FashionMNIST"
run_name: "baseline"
seed: 42
device: "auto"

data:
  dataset: "FashionMNIST"
  data_dir: "./data"
  batch_size: 64
  num_workers: 2

model:
  name: "SelmanCNN"
  num_classes: 10

training:
  epochs: 5
  optimizer: "adam" 
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  scheduler: "none"
  step_size: 3
  gamma: 0.5
  grad_accum_steps: 1

checkpoint:
  save_dir: "./checkpoints"
  save_every: 1
  resume_path: null